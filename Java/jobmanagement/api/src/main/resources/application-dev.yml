spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/job_management
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
  liquibase:
    contexts: dev

jwt:
  # Local dev only — must be >= 512 bits (64+ chars) for HS512 or JwtTokenProvider throws WeakKeyException
  secret: ${JWT_SECRET:bZaZU_WpZYuV-bgoiC4oXWogfFgODOqaLmBFh4DsUpfTFosV2OZ_x-7Yegj0xFHMcrMVNoIwPCL_02eLug6F6w}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

logging:
  level:
    com.company.jobmanagement: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
