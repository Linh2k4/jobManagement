spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Liquibase owns the schema in prod — Hibernate must not auto-alter it.
      # validate: fail fast on startup if entities and schema disagree.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

  # Redis (spring.cache.type: redis is set unconditionally in application.yml)
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 2000

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:jobmanagement}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Comma-separated list of allowed frontend origins, e.g. https://app.example.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.company.jobmanagement: INFO
    org.springframework: WARN
