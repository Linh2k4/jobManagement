<div class="notifications-page animate-fade-in">
  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Thông báo</h1>
      <p class="page-subtitle">Cập nhật những nhắc nhở, thay đổi công việc và phản hồi mới nhất</p>
    </div>
    <button
      *ngIf="notifications().length > 0"
      class="btn btn-secondary btn-sm"
      (click)="onMarkAllAsRead()"
    >
      <span class="icon">done_all</span> Đánh dấu tất cả đã đọc
    </button>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading()" class="state-card">
    <div class="spinner"></div>
    <p>Đang tải thông báo...</p>
  </div>

  <!-- ERROR -->
  <div *ngIf="error()" class="state-card error">
    <div class="state-icon-box error"><span class="icon">error</span></div>
    <h3>Có lỗi xảy ra</h3>
    <p class="text-muted">{{ error() }}</p>
  </div>

  <div *ngIf="!loading() && !error()">
    <!-- EMPTY -->
    <div *ngIf="notifications().length === 0" class="state-card">
      <div class="state-icon-box">
        <span class="icon">notifications_off</span>
      </div>
      <h3>Không có thông báo nào</h3>
      <p class="text-muted">Bạn đã đọc hết tất cả thông báo mới.</p>
    </div>

    <!-- NOTIFICATION LIST -->
    <div class="notification-items" *ngIf="notifications().length > 0">
      <app-notification-item
        *ngFor="let notification of notifications()"
        [notification]="notification"
        (markAsRead)="onMarkAsRead($event)"
        (delete)="onDelete($event)"
      ></app-notification-item>
    </div>
  </div>
</div>
